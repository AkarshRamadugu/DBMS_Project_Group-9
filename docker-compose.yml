version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB:       paper_trading
      POSTGRES_USER:     trader
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init.sh runs first (prefix 00_ ensures ordering)
      - ./db/init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
      # Sub-directories are mounted so init.sh can reference them
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./db/triggers:/docker-entrypoint-initdb.d/triggers:ro
      - ./db/procedures:/docker-entrypoint-initdb.d/procedures:ro
      - ./db/views:/docker-entrypoint-initdb.d/views:ro
      - ./db/seed:/docker-entrypoint-initdb.d/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d paper_trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI backend
  # ---------------------------------------------------------------------------
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     "5432"
      POSTGRES_DB:       paper_trading
      POSTGRES_USER:     trader
      POSTGRES_PASSWORD: changeme
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload

  # ---------------------------------------------------------------------------
  # Streamlit frontend
  # ---------------------------------------------------------------------------
  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    command: >
      streamlit run app.py
        --server.port 8501
        --server.address 0.0.0.0

volumes:
  pgdata:
